name: Build ZMK firmware

on:
  push:
    branches: [main]
    paths: ['boards/**', 'config/**', 'src/**', 'include/**', 'dts/**', 'CMakeLists.txt', 'Kconfig', 'VERSION', 'build.yaml', 'zephyr/**', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: rynor-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renderer-tests:
    name: GIF renderer host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/run_raw_gif_tests.py
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
  pr-checks:
    name: PR checks
    needs: [build, renderer-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful build
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.renderer-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  release:
    needs: [build, renderer-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/fw
      - name: Publish RYNOR ONE firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserved."
            exit 0
          fi
          mapfile -t UF2_FILES < <(find dist/fw -type f -name '*.uf2')
          [ "${#UF2_FILES[@]}" -eq 1 ] || { echo 'Expected exactly one RYNOR ONE UF2'; exit 1; }
          cp "${UF2_FILES[0]}" dist/firmware.uf2
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '{product:"RYNOR ONE",version:$version,firmwareVersion:$version,commit:$commit,firmware:"firmware.uf2"}' > dist/release-manifest.json
          gh release create "$TAG" --target "$GITHUB_SHA" --title "RYNOR ONE $VERSION" \
            --notes 'Standalone RYNOR ONE firmware. LumiPad Windows app is maintained at https://github.com/mihqag148/Lumipad-APP.' \
            dist/firmware.uf2 dist/release-manifest.json
