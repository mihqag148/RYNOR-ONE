# Distinguish the two real HID transports in Windows/ZMK Studio.
# BLE remains the wireless keyboard; USB keeps its own product name.
CONFIG_USB_DEVICE_PRODUCT="RYNOR ONE"

# RYNOR ONE product identity.
# ZMK normally implies a dynamic Bluetooth name and Zephyr persists that
# runtime name in settings. Older units can therefore keep advertising the
# pre-rename "DIAL DESK" value even after CONFIG_ZMK_KEYBOARD_NAME changed.
# Keep BLE naming static so stale persisted bt/name settings cannot override it.
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_DEVICE_NAME="RYNOR ONE"

# EC11 rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio unlocked while hardware keys are not populated yet
CONFIG_ZMK_STUDIO_LOCKING=n

# Persist runtime ZMK Studio keymap edits in the nice!nano NVS partition.
# Studio already selects these internally; keep them explicit for RYNOR ONE
# so a future config/refactor cannot silently turn persistence off.
CONFIG_SETTINGS=y
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y

# ST7789 TFT
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# Color UI objects and a separate static RGB565 drawing buffer.
# 25% of 320x172 RGB565 = 27520 bytes; single partial draw buffer.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# 6x WS2812B on P0.06 through SPIM3 (Zephyr 3.5 / ZMK v0.3)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Widgets
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# LVGL widgets
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_CANVAS=y

# Fonts
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Album artwork transport
CONFIG_BASE64=y

# Faster companion-app BLE transfers. Use a 247-byte ATT/L2CAP payload so
# Now Playing text/artwork needs far fewer Windows GATT writes.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# RYNOR uses a three-stage power path:
# - Sleep keeps BLE connected and stops panel/RGB activity.
# - Deep Sleep keeps BLE connected and leaves the nRF52840 in System ON idle
#   so GPIO/encoder activity wakes immediately without a reboot.
# - Optional Hibernate uses ZMK soft-off/System OFF for the lowest current.
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# nice!nano v2 high-voltage DCDC can increase idle current on some genuine
# boards and especially on compatible/clone boards. Keep it disabled so the
# low-power measurements are not dominated by REG0 DCDC overhead.
CONFIG_BOARD_ENABLE_DCDC_HV=n


# Custom screensaver frame storage in reserved internal flash.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y



# Detect nRF52840 System OFF wake so deep-sleep resume can skip the normal
# boot splash/backlight delay and feel immediate after the first wake event.
CONFIG_HWINFO=y
